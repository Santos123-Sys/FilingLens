name: One-shot CI fixer

on:
  push:
    branches: [feature/full-skill-runtime-enrichment]
    paths:
      - scripts/fix-ci.mjs
      - .github/workflows/fix-ci.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/full-skill-runtime-enrichment
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply targeted TypeScript fixes
        run: node scripts/fix-ci.mjs
      - name: Install dependencies
        run: npm ci
      - name: Validate
        run: |
          npm run check
          npm test
          npm run build
      - name: Commit validated fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: clear CI type errors before skill integration merge"
          git push origin HEAD:feature/full-skill-runtime-enrichment
