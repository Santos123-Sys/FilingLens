name: Issuer-primary proof acceptance (no SEC calls)
# Fetches only Apple's public issuer-owned document, never filinglens user data,
# no contact identity and no SEC infrastructure. Source authenticity is issuer
# website HTTPS plus SHA receipt, NOT SEC CompanyFacts official authentication.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/issuer-primary-acceptance.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Bounded repeat with failure-stage diagnostics; do not use access circumvention.
      - name: Verify real issuer-published FY2025 figures and negative controls
        run: npx --yes tsx ops/verify-issuer-public-statement.ts
