name: Scheduled SEC EDGAR acquisition

on:
  schedule:
    # Weekdays, outside the US market close and common top-of-hour cron spikes.
    - cron: "17 04 * * 1-5"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Override the watchlist lookback window (1-31 days)"
        type: number
        required: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: scheduled-sec-edgar-acquisition
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check SEC access clearance before contacting SEC
        run: node ops/check-sec-access.mjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ops/requirements-sec-acquisition.txt
      - name: Install pinned dependencies
        run: |
          npm ci
          python -m pip install --requirement ops/requirements-sec-acquisition.txt
      - name: Load SEC contact securely from Railway (signed GitHub OIDC)
        run: npx --yes tsx ops/sec-contact-from-railway.ts
      - name: Download recent primary filings into ticker/form/accession folders
        env:
          LOOKBACK_DAYS: ${{ inputs.lookback_days }}
        run: |
          args=(--watchlist config/sec-edgar-watchlist.json --output /tmp/sec-official)
          if [[ -n "$LOOKBACK_DAYS" ]]; then args+=(--lookback-days "$LOOKBACK_DAYS"); fi
          python ops/download-sec-edgar-filings.py "${args[@]}"
      - name: Acquire CompanyFacts and deliver to Railway
        env:
          SEC_IMPORT_URL: https://filinglens-sec-oidc-importer-production.up.railway.app/v1/sec/import
        run: npx --yes tsx ops/run-scheduled-sec-companyfacts.ts
      - name: Upload short-lived public-source archive
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sec-edgar-watchlist-${{ github.run_id }}
          path: /tmp/sec-official/sec-edgar-filings/
          if-no-files-found: warn
          retention-days: 3
          compression-level: 6
