name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/full-skill-runtime-enrichment]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Install data-tools dependencies
        run: python -m pip install -r services/financial-data-service/requirements.txt pytest==8.3.5

      - name: Test Yahoo bridge without network calls
        run: python -m unittest discover -s tests -p 'test_yfinance_bridge.py' -v

      - name: Verify vintage-safe forecast evaluation offline
        run: |
          python -m unittest discover -s tests -p 'test_forecast_cohort_acquisition.py' -v
          npm run forecast:evaluate > /tmp/forecast-results.json
          python ops/verify-forecast-cohort.py
          git diff --exit-code -- src/data/forecast-qualification-summary.json public/evaluations/forecast-qualification-v2.json

      - name: Lint (non-blocking existing baseline)
        run: npm run lint
        continue-on-error: true

      - name: Verify five-year forecasts and fresh-issuer qualification offline
        run: |
          python -m unittest discover -s tests -p 'test_five_year_acquisition.py' -v
          npm run forecast:evaluate:five-year > /tmp/five-year-results.json
          python ops/verify-five-year.py
          git diff --exit-code -- src/data/five-year-qualification-summary.json public/evaluations/five-year-evaluation-v3.json

      - name: Reject production dependency advisories
        run: npm audit --omit=dev --audit-level=moderate

      - name: Verify frozen forward forecast ledger without claiming future outcomes
        run: |
          npm run forecast:policy
          git diff --exit-code -- src/data/forecast-reliability-policy.json
          npm run forecast:watch -- verify
          python ops/verify-forecast-watch.py

      - name: Typecheck
        run: npm run check

      - name: Test
        run: npm test

      - name: Test data-tools PowerPoint round-trip
        run: PYTHONPATH=services/financial-data-service pytest -q services/financial-data-service/tests

      - name: Build
        run: npm run build

      - name: Smoke test exact financial ratio skill
        run: python3 skills/skill_runner.py skills/financial-ratio-toolkit/source.zip.b64 scripts/analyze.py --help

      - name: Smoke test exact financial statement skill
        run: |
          python3 skills/skill_runner.py skills/financial-statement-analyzer/source.zip.b64 scripts/analyze_financials.py --sample > /tmp/financial-sample.json
          python3 skills/skill_runner.py skills/financial-statement-analyzer/source.zip.b64 scripts/analyze_financials.py /tmp/financial-sample.json --json > /tmp/financial-result.json
          python3 -c 'import json; json.load(open("/tmp/financial-result.json"))'

      - name: Smoke test exact timeline validator
        run: |
          cat > /tmp/timeline.json <<'JSON'
          {
            "module": "historian",
            "module_status": "complete",
            "issuer_context": {
              "issuer_name": "Fixture Issuer",
              "jurisdiction": "SEC",
              "form_type": "10-K",
              "filing_period": "2025",
              "filing_date": "2026-01-31",
              "currency": "USD"
            },
            "events": [
              {
                "id": "evt-2025-fixture",
                "date": "2025",
                "date_granularity": "year",
                "title": "Fixture event",
                "summary": "Fixture event used only to validate the bundled Python utility.",
                "category": "other",
                "materiality": "routine",
                "source_type": "filing",
                "source_ref": {
                  "kind": "excerpt",
                  "section": "Fixture",
                  "quote": "The fixture issuer reported this event in 2025."
                },
                "confidence": "high"
              }
            ],
            "enrichment_status": "none",
            "validation_flags": [],
            "generated_at": "2026-01-31T00:00:00.000Z"
          }
          JSON
          python3 skills/skill_runner.py skills/filing-timeline-extractor/source.zip.b64 filing-timeline-extractor/scripts/validate_timeline.py /tmp/timeline.json
