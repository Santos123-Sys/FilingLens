name: Apply FilingLens feature bundle

on:
  push:
    branches:
      - feature/powerpoint-agentic-ux
    paths:
      - '.feature-payload/ready'

permissions:
  contents: write

jobs:
  apply-feature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and apply feature files
        shell: python
        run: |
          import base64
          import pathlib
          import shutil
          import zipfile

          root = pathlib.Path('.')
          payload = root / '.feature-payload'
          encoded = ''.join(path.read_text() for path in sorted(payload.glob('*.b64')))
          archive = root / '.filinglens-feature-changes.zip'
          archive.write_bytes(base64.b64decode(encoded))
          with zipfile.ZipFile(archive) as bundle:
              bundle.extractall(root)
          archive.unlink()
          shutil.rmtree(payload)
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add PowerPoint export and staged agentic UX"
          git push origin HEAD:feature/powerpoint-agentic-ux
